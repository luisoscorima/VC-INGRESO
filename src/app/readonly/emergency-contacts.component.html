<div class="vc-page min-h-screen">
  <div class="vc-page-inner vc-card bg-white dark:bg-gray-800/90 p-4 sm:p-6 max-w-3xl mx-auto">
    <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-1">Emergencias</h2>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">
      Números en caso de emergencias.
    </p>

    <div *ngIf="auth.isAdministratorRole()" class="mb-6 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50/60 dark:bg-gray-900/20 p-4">
      <button type="button" (click)="toggleEditor()"
        class="vc-btn-primary w-full flex items-center justify-between !px-3 !py-2 text-sm font-semibold mb-3">
        <span>Administrar contactos</span>
        <mat-icon class="!text-base !w-4 !h-4 transition-transform duration-200" [class.rotate-180]="editorOpen">expand_more</mat-icon>
      </button>

      <div *ngIf="editorOpen" class="space-y-3">
        <label class="block">
          <span class="text-xs font-medium text-gray-600 dark:text-gray-400">Etiqueta</span>
          <input [(ngModel)]="draftLabel" type="text" placeholder="Ej. Bomberos"
            class="mt-1 w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </label>
        <label class="block">
          <span class="text-xs font-medium text-gray-600 dark:text-gray-400">Teléfono</span>
          <input [(ngModel)]="draftPhone" type="text" placeholder="105"
            class="mt-1 w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </label>
        <label class="block">
          <span class="text-xs font-medium text-gray-600 dark:text-gray-400">Detalle (opcional)</span>
          <input [(ngModel)]="draftDetail" type="text"
            class="mt-1 w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 text-sm text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </label>
        <button type="button" [disabled]="saving" (click)="addContact()"
          class="inline-flex items-center gap-2 rounded-lg bg-amber-600 px-3 py-2 text-sm font-medium text-white hover:bg-amber-700 disabled:opacity-60 focus:outline-none focus:ring-2 focus:ring-amber-500">
          <mat-icon class="!text-lg !w-5 !h-5">person_add</mat-icon>
          Agregar contacto
        </button>
      </div>
    </div>

    <div *ngIf="loading" class="text-sm text-gray-500 dark:text-gray-400 mb-4">Cargando...</div>

    <div *ngIf="!loading && contacts.length === 0" class="rounded-lg border border-dashed border-gray-300 dark:border-gray-600 p-6 text-center text-gray-600 dark:text-gray-400">
      <p class="mb-1">Aún no hay contactos configurados.</p>
      <p class="text-sm" *ngIf="auth.isAdministratorRole()">Use el panel de administración para agregarlos.</p>
    </div>

    <ul class="space-y-3">
      <li *ngFor="let c of contacts; let i = index"
        class="rounded-xl border border-gray-200 dark:border-gray-600 p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 bg-gray-50/80 dark:bg-gray-700/30">
        <div>
          <p class="font-semibold text-gray-900 dark:text-white">{{ c.label }}</p>
          <p *ngIf="c.detail" class="text-sm text-gray-600 dark:text-gray-400 mt-1">{{ c.detail }}</p>
        </div>
        <div class="shrink-0 flex items-center gap-2">
          <a *ngIf="hasDialablePhone(c.phone)" [href]="telHref(c.phone)"
            class="inline-flex items-center gap-2 rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500">
            <mat-icon class="!text-lg !w-5 !h-5">call</mat-icon>
            {{ c.phone }}
          </a>
          <span *ngIf="!hasDialablePhone(c.phone)" class="text-sm text-gray-500 dark:text-gray-400 italic">
            — número pendiente —
          </span>
          <button *ngIf="auth.isAdministratorRole()" type="button" [disabled]="saving" (click)="removeContact(i)"
            class="inline-flex items-center rounded-md p-2 text-red-600 hover:bg-red-50 dark:hover:bg-red-950/40 disabled:opacity-60"
            title="Quitar contacto">
            <mat-icon class="!text-lg !w-5 !h-5">delete</mat-icon>
          </button>
        </div>
      </li>
    </ul>
  </div>
</div>
