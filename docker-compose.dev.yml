# Desarrollo local: MySQL 3306, API 8080, Frontend 4200
# Uso: docker compose -f docker-compose.dev.yml up -d
services:
  mysql:
    image: mysql:8.0
    container_name: vc-ingreso-mysql
    env_file:
      - .env
    environment:
      - TZ=America/Lima
      - MYSQL_ROOT_PASSWORD=${DB_PASS:-change_me}
      - MYSQL_DATABASE=${DB_NAME:-vc_db}
      - MYSQL_CHARSET=${DB_CHARSET:-utf8mb4}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init-docker.sh:/docker-entrypoint-initdb.d/01-init-docker.sh:ro
      - ./database/vc_create_database.sql:/docker-entrypoint-initdb.d/02-vc_create_database.sql.template:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=America/Lima --event-scheduler=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vc-ingreso-api
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-vc_db}
      - DB_LICENSE_NAME=${DB_LICENSE_NAME:-crearttech_clientes}
      - DB_USER=root
      - DB_PASS=${DB_PASS:-change_me}
      - DB_CHARSET=${DB_CHARSET:-utf8mb4}
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN:-*}
      - PHP_OPCACHE_ENABLE=0
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - ./server:/var/www/html
      - uploads_data:/var/www/html/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: vc-ingreso-frontend
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - frontend_node_modules:/workspace/node_modules
    command: sh -c "echo '>>> npm install...' && npm install --legacy-peer-deps && echo '>>> Iniciando Angular...' && npm run start -- --host 0.0.0.0 --port 4200"
    ports:
      - "4200:4200"
    environment:
      - TZ=America/Lima
      - CHOKIDAR_USEPOLLING=true
      - CI=1
      - NG_CLI_ANALYTICS=false
    depends_on:
      - api
    restart: unless-stopped

  lpr-worker:
    build:
      context: ./lpr-worker
      dockerfile: Dockerfile
    container_name: vc-ingreso-lpr-worker
    env_file:
      - .env
    environment:
      - TZ=America/Lima
      - LPR_API_BASE_URL=${LPR_API_BASE_URL:-http://api/api/v1}
      - LPR_SERVICE_TOKEN=${LPR_SERVICE_TOKEN:-change_me_lpr_service_token}
      - LPR_REFRESH_CAMERAS_SEC=${LPR_REFRESH_CAMERAS_SEC:-30}
      - LPR_LOG_LEVEL=${LPR_LOG_LEVEL:-INFO}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql_data:
  frontend_node_modules:
  uploads_data:

networks:
  default:
    driver: bridge
